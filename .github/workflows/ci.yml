name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Native Port
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Windows Solution
        shell: pwsh
        run: ./tools/Setup-Windows.ps1 -SkipToolDownloads
      - name: Build Hardware-Layer Tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -version '[17,18)' -find 'MSBuild/Current/Bin/amd64/MSBuild.exe'
          foreach ($target in @('test_host', 'test_gte', 'test_gpu', 'test_inline_gte')) {
            & $msbuild "build/windows/$target.vcxproj" /p:Configuration=Debug /p:Platform=Win32 /m /v:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run Windows Tests
        shell: pwsh
        run: |
          build/python/Scripts/python.exe -m unittest discover -s native/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($target in @('test_host', 'test_gpu', 'test_inline_gte')) {
            & "build/windows/Debug/$target.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          build/windows/Debug/test_gte.exe native/tests/gte_golden.txt
