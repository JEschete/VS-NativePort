name: Source Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Two independent jobs run in parallel: the tool and ledger controls, and the
# source-quality scan, which dominates the wall time.
jobs:
  tools:
    name: Tool and ledger controls
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # The provenance check reads the pinned decomp; no other submodule is fetched. A failed fetch fails the job.
      - name: Fetch the pinned decomp submodule
        run: git submodule update --init --depth 1 resources/rood-reverse
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Python checks
        run: python -m pip install -r tools/requirements.txt
      - name: Verify workflow exit-code controls
        run: python -m unittest discover -s tools/lint -p test_workflows.py -v
      - name: Verify encounter source adaptations
        run: python tools/port/test_encounter_fixups.py
      - name: Verify scene diagnostic adaptations
        run: python tools/port/test_scene_trace_fixups.py
      - name: Verify module symbol extents
        run: python tools/port/test_module_symbol_extents.py
      - name: Verify naming contracts
        run: python -m unittest discover -s tools\naming -p test_*.py -v
      - name: Verify external player contracts
        run: python -m unittest discover -s Native\Player\tests -v
      - name: Verify gate controls
        run: python -m unittest discover -s tools\ledger -p test_gates.py -v
      - name: Check ownership, promotion, quality, behavior and retirement gates
        run: python tools\ledger\gates.py --check
      - name: Verify modernization controls
        run: python -m unittest discover -s tools\ledger -p test_modernization.py -v
      - name: Verify hazard controls
        run: python -m unittest discover -s tools\ledger -p test_hazards.py -v
      - name: Verify header migration controls
        run: python -m unittest discover -s tools\ledger -p test_headers.py -v
      - name: Verify layer boundary controls
        run: python -m unittest discover -s tools\ledger -p test_boundaries.py -v
      - name: Verify content ledger controls
        run: python -m unittest discover -s tools\ledger -p test_content.py -v
      - name: Verify regression controls
        run: python -m unittest discover -s tools\test -p test_regression.py -v
      - name: Verify decomp provenance controls
        run: python -m unittest discover -s tools\ledger -p test_provenance.py -v
      - name: Check the modernization ledger
        run: python tools\ledger\modernization.py --check
      - name: Check the platform hazard ledger
        run: python tools\ledger\hazards.py --check
      - name: Check the C++ header migration ledger
        run: python tools\ledger\headers.py --check
      - name: Check the layer boundary ledger
        run: python tools\ledger\boundaries.py --check
      - name: Check the content ledger
        run: python tools\ledger\content.py --check
      - name: Check the regression baseline
        run: python tools\test\regression.py static
      - name: Check decomp provenance citations
        run: python tools\ledger\provenance.py --check

  source:
    name: Source quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - name: Install Python checks
        run: python -m pip install -r tools/requirements.txt
      - name: Install clone checker
        run: npm ci --prefix tools/lint --ignore-scripts --no-audit --no-fund
      - name: Verify tool positive controls
        run: python -m unittest discover -s tools/lint -p test_quality.py -v
      - name: Reject new source-quality findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\quality-native.cmd --since github
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: build/quality
          if-no-files-found: ignore