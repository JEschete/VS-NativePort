name: Source Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - name: Install Python checks
        run: python -m pip install -r tools/requirements.txt
      - name: Install clone checker
        run: npm ci --prefix tools/lint --ignore-scripts --no-audit --no-fund
      - name: Verify tool positive controls
        run: python -m unittest discover -s tools/lint -p test_quality.py -v
      - name: Verify encounter source adaptations
        run: python tools/port/test_encounter_fixups.py
      - name: Verify scene diagnostic adaptations
        run: python tools/port/test_scene_trace_fixups.py
      - name: Verify naming contracts
        run: python -m unittest discover -s tools\naming -p test_*.py -v
      - name: Verify external player contracts
        run: python -m unittest discover -s Native\Player\tests -v
      - name: Reject new source-quality findings
        run: .\quality-native.cmd
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: build/quality
          if-no-files-found: ignore