name: Source Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - name: Install Python checks
        run: python -m pip install -r tools/requirements.txt
      - name: Install clone checker
        run: npm ci --prefix tools/lint --ignore-scripts --no-audit --no-fund
      - name: Verify tool positive controls
        run: python -m unittest discover -s tools/lint -p test_quality.py -v
      - name: Verify workflow exit-code controls
        run: python -m unittest discover -s tools/lint -p test_workflows.py -v
      - name: Verify encounter source adaptations
        run: python tools/port/test_encounter_fixups.py
      - name: Verify scene diagnostic adaptations
        run: python tools/port/test_scene_trace_fixups.py
      - name: Verify module symbol extents
        run: python tools/port/test_module_symbol_extents.py
      - name: Verify the MIPS differential interpreter
        run: python tools/port/test_differential.py
      - name: Verify promotion bookkeeping
        run: python tools/port/test_promote.py
      - name: Verify naming contracts
        run: python -m unittest discover -s tools\naming -p test_*.py -v
      - name: Verify external player contracts
        run: python -m unittest discover -s Native\Player\tests -v
      - name: Verify gate controls
        run: python -m unittest discover -s tools\ledger -p test_gates.py -v
      - name: Check ownership, promotion, quality, behavior and retirement gates
        run: python tools\ledger\gates.py --check
      - name: Verify modernization controls
        run: python -m unittest discover -s tools\ledger -p test_modernization.py -v
      - name: Verify hazard controls
        run: python -m unittest discover -s tools\ledger -p test_hazards.py -v
      - name: Verify regression controls
        run: python -m unittest discover -s tools\test -p test_regression.py -v
      - name: Verify promotion check controls
        run: python -m unittest discover -s tools\test -p test_promotion_check.py -v
      - name: Check the modernization ledger
        run: python tools\ledger\modernization.py --check
      - name: Check the platform hazard ledger
        run: python tools\ledger\hazards.py --check
      - name: Check the regression baseline
        run: python tools\test\regression.py static
      - name: Reject new source-quality findings
        run: .\quality-native.cmd
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: build/quality
          if-no-files-found: ignore