[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-player"
version = "0.1.0"
description = "External, telemetry-driven native gameplay test player"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vs-player = "vs_player.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["vs_player*"]
